  <line x1="64" y1="24" x2="64" y2="104" stroke="#ffffff" stroke-width="4" opacity="0.55"/>
  <rect x="70" y="70" width="40" height="28" rx="5" fill="#1c1c22" stroke="#ff8a2a" stroke-width="6"/>
</svg>
